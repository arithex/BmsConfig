name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/BmsConfig.Tests -c Release

      - name: Build Config.exe
        run: dotnet build src/BmsConfig -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: Config
          path: src/BmsConfig/bin/Release/net48/Config.exe
